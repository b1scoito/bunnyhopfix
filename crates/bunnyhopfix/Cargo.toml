[package]
name = "bunnyhopfix"
description = "CS:S bhop delay (jump prediction) fixer: patcher and launcher for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "bunnyhopfix"
path = "src/main.rs"

[dependencies]
bhopfix-core.workspace = true

# The Windows backend talks to the Win32 API directly (raw `extern "system"`
# declarations), so libc is a Linux-only dependency.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
