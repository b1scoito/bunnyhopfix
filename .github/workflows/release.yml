name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: build linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Full release build: the patcher bin plus the LD_PRELOAD cdylib.
      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          tar -czf "bunnyhop-ape-${{ github.ref_name }}-x86_64-linux.tar.gz" \
            --transform 's,^target/release/,,' \
            target/release/bunnyhop-ape \
            target/release/librawinput2.so \
            README.md \
            LICENSE \
            verify-live.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bunnyhop-ape-linux
          path: bunnyhop-ape-${{ github.ref_name }}-x86_64-linux.tar.gz
          if-no-files-found: error

  windows:
    name: build windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Windows ships the prediction patcher only; the `rawinput2` cdylib is an
      # LD_PRELOAD library and therefore Linux-only.
      - name: Build
        run: cargo build --release --bin bunnyhop-ape

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/bunnyhop-ape.exe, README.md, LICENSE -DestinationPath "bunnyhop-ape-${{ github.ref_name }}-x86_64-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bunnyhop-ape-windows
          path: bunnyhop-ape-${{ github.ref_name }}-x86_64-windows.zip
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bunnyhop-ape-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bunnyhop-ape-${{ github.ref_name }}-x86_64-linux.tar.gz
            bunnyhop-ape-${{ github.ref_name }}-x86_64-windows.zip
