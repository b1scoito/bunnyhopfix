name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The changelog is generated from commit subjects (see cliff.toml), so a
  # subject that does not parse is a hole in the release notes. Catch it on the
  # way in, where the author can still amend, instead of at release time.
  commits:
    name: commit convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check subjects are Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A brand-new branch reports an all-zero "before"; there is no range
          # to check in that case, so look at the tip commit alone.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          # Merge commits are generated by GitHub, not written by a human.
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge\ *|Revert\ *) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|perf|refactor|revert|docs|test|ci|build|chore)(\([a-z0-9._-]+\))?!?: .+'; then
              echo "::error::not a Conventional Commit: $subject"
              bad=1
            fi
          done <<< "$(git log --no-merges --format=%s $RANGE)"
          if [ "$bad" = 1 ]; then
            echo "::error::allowed types: feat fix perf refactor revert docs test ci build chore"
            echo "::error::format: type(scope)!: subject   e.g. fix(hook): validate the GOT slot before writing"
            exit 1
          fi
          echo "all commit subjects parse"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The workspace denies clippy::all and warns on missing docs; -D warnings
      # makes both fatal here rather than in a reviewer's terminal.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The pattern-engine tests are self-contained. The resolver tests open the
      # *installed* Counter-Strike: Source and re-derive every signature and
      # RTTI lookup against it, and self-skip when the game is absent — which is
      # why they pass on a bare runner. On a maintainer's machine the same
      # `cargo test` is a genuine "did a game update break the lookups?" check.
      - name: Test
        run: cargo test --workspace

  build-linux:
    name: build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release

      # Both artifacts, or the release workflow would fail later instead of now.
      - name: Check artifacts
        run: |
          test -x target/release/bunnyhopfix
          test -f target/release/libbhopfix.so

      - uses: actions/upload-artifact@v4
        with:
          name: bunnyhopfix-linux
          path: |
            target/release/bunnyhopfix
            target/release/libbhopfix.so
          if-no-files-found: error

  build-windows:
    name: build (windows)
    runs-on: windows-latest
    # Statically link the CRT so the controller/DLL pair needs no VC++
    # redistributable. This MUST match release.yml and schedule.yml.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

      - name: Check artifacts
        shell: bash
        run: |
          test -f target/release/bunnyhopfix.exe
          test -f target/release/bhopfix.dll

      - uses: actions/upload-artifact@v4
        with:
          name: bunnyhopfix-windows
          path: |
            target/release/bunnyhopfix.exe
            target/release/bhopfix.dll
          if-no-files-found: error

  cross-windows:
    name: cross-build (windows-gnu via zig)
    runs-on: ubuntu-latest
    # Same static CRT as `build-windows` and as the release/nightly Windows
    # assets; this job guards the cross path that the nightly build ships from.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # The Windows backend is developed from Linux: the maintainer
      # cross-compiles it with zig as the linker instead of booting Windows for
      # every edit. Guarding that exact pipeline here means a break in the local
      # development loop is caught in CI and not only on `build-windows`, whose
      # linker (MSVC) is a different one entirely.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Add target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cross-build
        run: cargo zigbuild --workspace --release --target x86_64-pc-windows-gnu

      - name: Check cross artifacts
        run: |
          test -f target/x86_64-pc-windows-gnu/release/bunnyhopfix.exe
          test -f target/x86_64-pc-windows-gnu/release/bhopfix.dll

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keeps the manifests' `rust-version = "1.88"` honest. Edition 2024 needs
      # 1.85; 1.88 is the floor for the let-chains and `#[expect]` the tree uses.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace

  # CHANGELOG.md is only written at release time, so `dev` never accumulates
  # bot commits. This is how you see the pending notes in the meantime: the
  # rendering of every commit since the last tag, in the job summary.
  changelog-preview:
    name: pending release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Render
        run: |
          git cliff --config cliff.toml --unreleased --strip header > pending.md
          if [ -s pending.md ]; then
            {
              echo "### Pending release notes"
              echo
              echo "Everything on this branch since the last \`v*\` tag, as it"
              echo "will appear in the next release."
              echo
              cat pending.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changelog-worthy commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi
