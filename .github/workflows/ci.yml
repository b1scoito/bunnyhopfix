name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The workspace denies clippy::all and warns on missing docs; -D warnings
      # makes both fatal here rather than in a reviewer's terminal.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The pattern-engine tests are self-contained. The resolver tests open the
      # *installed* Counter-Strike: Source and re-derive every signature and
      # RTTI lookup against it, and self-skip when the game is absent — which is
      # why they pass on a bare runner. On a maintainer's machine the same
      # `cargo test` is a genuine "did a game update break the lookups?" check.
      - name: Test
        run: cargo test --workspace

  build-linux:
    name: build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release

      # Both artifacts, or the release workflow would fail later instead of now.
      - name: Check artifacts
        run: |
          test -x target/release/bunnyhopfix
          test -f target/release/libbhopfix.so

      - uses: actions/upload-artifact@v4
        with:
          name: bunnyhopfix-linux
          path: |
            target/release/bunnyhopfix
            target/release/libbhopfix.so
          if-no-files-found: error

  build-windows:
    name: build (windows)
    runs-on: windows-latest
    # Statically link the CRT so `bunnyhopfix.exe` is a true drop-and-run
    # download with no VC++ redistributable dependency — the single-file asset
    # users know from the C++ 1.0 release. The tool has no C dependencies, so
    # this costs nothing. It MUST match the release workflow's Windows jobs:
    # this job exists to catch a break in exactly that build. Do not remove.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Only the `bunnyhopfix` bin. The hook crate is an LD_PRELOAD cdylib that
      # pokes at ELF/GOT/RTTI through /proc/self/{maps,mem}; it is `#![cfg(unix)]`
      # and is not part of a Windows release.
      - name: Build
        run: cargo build -p bunnyhopfix --release

      - name: Check artifact
        shell: bash
        run: test -f target/release/bunnyhopfix.exe

      - uses: actions/upload-artifact@v4
        with:
          name: bunnyhopfix-windows
          path: target/release/bunnyhopfix.exe
          if-no-files-found: error

  cross-windows:
    name: cross-build (windows-gnu via zig)
    runs-on: ubuntu-latest
    # Same static CRT as `build-windows` and as the release/nightly Windows
    # assets; this job guards the cross path that the nightly build ships from.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # The Windows backend is developed from Linux: the maintainer
      # cross-compiles it with zig as the linker instead of booting Windows for
      # every edit. Guarding that exact pipeline here means a break in the local
      # development loop is caught in CI and not only on `build-windows`, whose
      # linker (MSVC) is a different one entirely.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Add target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cross-build
        run: cargo zigbuild --release -p bunnyhopfix --target x86_64-pc-windows-gnu

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keeps the manifests' `rust-version = "1.88"` honest. Edition 2024 needs
      # 1.85; 1.88 is the floor for the let-chains and `#[expect]` the tree uses.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace
